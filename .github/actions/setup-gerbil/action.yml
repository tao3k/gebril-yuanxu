name: Set up Gerbil prerequisites
description: Activate the immutable gerbil-bazel release and required tools.
outputs:
  archive-sha256:
    description: Verified digest of the selected Gerbil release archive.
    value: ${{ steps.install-release.outputs.archive-sha256 }}
runs:
  using: composite
  steps:
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        missing=()
        for package in gcc g++ make ca-certificates git jq libsqlite3-dev libssl-dev openssl pkg-config sqlite3 zlib1g-dev; do
          if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -qx 'install ok installed'; then
            missing+=("$package")
          fi
        done
        if [[ "${#missing[@]}" -gt 0 ]]; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${missing[@]}"
        fi
    - name: Install macOS dependencies
      if: runner.os == 'macOS'
      env:
        HOMEBREW_NO_AUTO_UPDATE: 1
        HOMEBREW_NO_INSTALL_CLEANUP: 1
      shell: bash
      run: |
        brew list --formula ghostscript >/dev/null 2>&1 && brew unlink ghostscript || true
        brew install coreutils gcc jq openssl pkg-config sqlite zlib
        echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
        gcc_prefix="$(brew --prefix gcc)"
        gcc_bin="$(find "$gcc_prefix/bin" -maxdepth 1 -type f -name 'gcc-[0-9]*' | awk -F- '{print $NF "\t" $0}' | sort -n | tail -n 1 | cut -f2-)"
        test -x "$gcc_bin"
        echo "GERBIL_GCC=$gcc_bin" >> "$GITHUB_ENV"
        openssl_prefix="$(brew --prefix openssl@3 2>/dev/null || brew --prefix openssl)"
        # Native executable links must resolve the installed formula, even when
        # the immutable SDK was configured against an older Homebrew Cellar.
        echo "LIBRARY_PATH=$openssl_prefix/lib:$(brew --prefix sqlite)/lib:$(brew --prefix zlib)/lib${LIBRARY_PATH:+:$LIBRARY_PATH}" >> "$GITHUB_ENV"
        echo "PKG_CONFIG_PATH=$openssl_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
    - name: Install the supported command tools
      uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
      with:
        tool: just@1.56.0,ripgrep@15.1.0
        checksum: 'true'
        fallback: cargo-binstall
    - name: Record the selected Just CLI
      shell: bash
      run: |
        just --version
        rg --version
        test "$(just --version)" = 'just 1.56.0'
    - name: Install immutable Gerbil release
      id: install-release
      shell: bash
      run: |
        set -euo pipefail
        revision=2591dcd9b7c6d2c4e9dd8611a17c5b1a5d82bbdb
        # The toolchain must stay outside the package source snapshot.
        release_root="${RUNNER_TEMP:?}/gerbil-release/v0.19-${revision:0:7}"

        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64)
            release_os=linux
            release_arch=x86_64
            tag="gerbil-v0.19-$revision-linux-x86_64-portable-full-single-host-unlimited-patcha379bb244bfa"
            sha256=3b345b1af68dfbbc0e73bae64941e4c8910d0ca192d81432ce699c5af385b565
            ;;
          Darwin-arm64)
            release_os=darwin
            release_arch=aarch64
            tag="gerbil-v0.19-$revision-darwin-aarch64-gcc16-arm64-single-host-unlimited-patch4167edcd1c36"
            sha256=5b3ff114b64ef2217fbfae9f608100e4508fdaf4579d2b8346bdbe7cc0aea641
            ;;
          *)
            printf 'unsupported Gerbil release host: %s-%s\n' "$(uname -s)" "$(uname -m)" >&2
            exit 64
            ;;
        esac

        archive="$tag.tar.gz"
        download="${RUNNER_TEMP:?}/$archive"
        mkdir -p "$release_root"
        curl --fail --location --retry 3 --retry-all-errors --output "$download" \
          "https://github.com/tao3k/gerbil-bazel/releases/download/$tag/$archive"
        echo "$sha256  $download" | shasum -a 256 --check
        echo "archive-sha256=$sha256" >> "$GITHUB_OUTPUT"
        tar -xzf "$download" -C "$release_root" --strip-components=1

        jq -e --arg revision "$revision" --arg os "$release_os" --arg arch "$release_arch" \
          '.schema == "gerbil-bazel.toolchain-release.v1" and
           .upstreamRevision == $revision and
           .platform.os == $os and .platform.arch == $arch' \
          "$release_root/gerbil-toolchain-release.json" >/dev/null

        source "$release_root/activate"
        echo "$GERBIL_PREFIX/bin" >> "${GITHUB_PATH:?}"
        {
          echo "GERBIL_PREFIX=$GERBIL_PREFIX"
          echo "GERBIL_HOME=$GERBIL_HOME"
          echo "GAMBOPT=$GAMBOPT"
        } >> "${GITHUB_ENV:?}"

        "$GERBIL_PREFIX/bin/gerbil" --version
        "$GERBIL_PREFIX/bin/gerbil" interactive -e '(displayln "gerbil-ready")'
    - name: Select actual compiler capacity
      shell: bash
      run: |
        if [[ "$RUNNER_OS" == macOS ]]; then
          workers=$(sysctl -n hw.logicalcpu)
        else
          workers=$(getconf _NPROCESSORS_ONLN)
        fi
        echo "GERBIL_BUILD_CORES=$workers" >> "$GITHUB_ENV"
        echo "BUILD-WORKERS $workers"
