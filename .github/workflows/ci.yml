name: Yuanxu
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: yuanxu-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Native Gerbil (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    uses: ./.github/workflows/native-platform.yml
    with:
      os: ${{ matrix.os }}
