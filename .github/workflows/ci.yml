name: Yuanxu
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: yuanxu-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  platform:
    name: Gerbil (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    uses: ./.github/workflows/platform.yml
    with:
      os: ${{ matrix.os }}
