name: Yuanxu proofs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dev/proofs/lean/lean-toolchain') }}
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: dev/proofs/lean
          auto-config: false
          build: false
          test: false
          lint: false
      - name: Build Yuanxu proof package
        working-directory: dev/proofs/lean
        run: lake build

  quint:
    name: Yuanxu Quint finite models (${{ matrix.shard }})
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Quint
        run: npm ci --prefix dev/proofs/quint --no-audit --no-fund
      - uses: actions/cache@v5
        with:
          path: ~/.quint/apalache-dist-0.62.1
          key: quint-apalache-0.62.1-${{ runner.os }}-${{ runner.arch }}
      - name: Prepare pinned backend
        run: python3 dev/proofs/quint/prepare.py
      - name: Check runtime CLI isolation and deadlines
        run: python3 -m unittest discover -s dev/proofs/quint -p test_typecheck.py
      - name: Check finite models and matched faults
        run: python3 dev/proofs/quint/check.py --shard-count 8 --shard-index ${{ matrix.shard }} --receipt "$RUNNER_TEMP/yuanxu-quint-proof.ss"
      - uses: actions/upload-artifact@v7
        with:
          name: yuanxu-quint-proof-${{ matrix.shard }}
          path: ${{ runner.temp }}/yuanxu-quint-proof.ss
