name: Platform
on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    name: Build and bootstrap
    runs-on: ${{ inputs.os }}
    timeout-minutes: 120
    env:
      GERBIL_PATH: ${{ github.workspace }}/.gerbil
      GERBIL_BUILD_CORES: '2'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup-gerbil
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .gerbil/pkg
            .gerbil/lib
            .gerbil/bin
          key: yuanxu-gerbil-${{ runner.os }}-${{ runner.arch }}-v0.19-2591dcd-${{ hashFiles('gerbil.pkg') }}
      - name: Install pinned dependencies
        run: |
          echo "BUILD-WORKERS $GERBIL_BUILD_CORES"
          GERBIL_BUILD_VERBOSE=1 gerbil deps --install
      - name: Check Yuanxu package namespace
        run: just check-package-namespace
      - name: Build Yuanxu
        run: just build
      - name: Test public Yuanxu prelude
        run: just test-yuanxu-prelude
      - name: Qualify source-only selected build bootstrap
        run: just test-bootstrap
      - name: Check complete disjoint test partition
        run: just check-test-groups
      - name: Preserve dependency and library tree
        run: tar -czf "$RUNNER_TEMP/yuanxu-package.tar.gz" .gerbil
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: yuanxu-package-${{ inputs.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/yuanxu-package.tar.gz
          retention-days: 2
          if-no-files-found: error
  tests:
    name: Test ${{ matrix.group }}
    needs: build
    runs-on: ${{ inputs.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        group: [bootstrap, modules, contracts, objects, scenarios, providers, runtime]
    env:
      GERBIL_PATH: ${{ github.workspace }}/.gerbil
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup-gerbil
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: yuanxu-package-${{ inputs.os }}-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Restore same-head artifacts
        run: tar -xzf "$RUNNER_TEMP/yuanxu-package.tar.gz"
      - name: Prepare real Provider qualification inputs
        if: matrix.group == 'providers'
        run: |
          inputs=$(nix-build --no-out-link t/fixtures/opentofu/ci.nix)
          families=$(readlink -f "$inputs/families")
          {
            echo "YUANXU_OPENTOFU_ARTIFACT=$families"
            echo "YUANXU_OPENTOFU_FLAKE_ARTIFACT=$families"
            echo "YUANXU_JSON_SCHEMA_AWS_EXPORT=$families/aws/schema.json"
            echo "YUANXU_OPENTOFU_TEST_PARENT_ARTIFACT=$(readlink -f "$inputs/parent")"
            echo "YUANXU_OPENTOFU_TEST_CHILD_ARTIFACT=$(readlink -f "$inputs/child")"
            echo "YUANXU_AWS_BINARY=$(readlink -f "$inputs/binary")/provider"
            echo "YUANXU_NIX_TEST_TOOLS=$(cat "$inputs/tools")"
          } >> "$GITHUB_ENV"
      - name: Run complete group with serial 2 GiB workers
        run: just test-directory '${{ matrix.group }}'
