name: Platform
on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    name: Build and bootstrap
    runs-on: ${{ inputs.os }}
    timeout-minutes: 120
    outputs:
      package-ready: ${{ steps.upload-package.outcome }}
    env:
      GERBIL_PATH: ${{ github.workspace }}/.gerbil
      GERBIL_BUILD_CORES: '2'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup-gerbil
        id: gerbil
      - name: Select runtime compiler capacity
        shell: bash
        run: |
          # Dependency compilation is serial; use the actual runner allocation.
          # Test heap and watchdog profiles retain their independent limits.
          if [[ "$RUNNER_OS" == macOS ]]; then
            workers=$(sysctl -n hw.logicalcpu)
          else
            workers=$(getconf _NPROCESSORS_ONLN)
          fi
          echo "GERBIL_BUILD_CORES=$workers" >> "$GITHUB_ENV"
          echo "BUILD-WORKERS $workers"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: restore-dependencies
        # Only the pinned POO dependency namespace crosses CI runs. Archiving
        # lib itself would recursively include test approvals; a negative
        # top-level glob does not remove descendants of an archived directory.
        with:
          path: |
            .gerbil/pkg
            .gerbil/lib/clan
            .gerbil/lib/static/clan__poo*.scm
            .gerbil/bin
          key: yuanxu-gerbil-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.gerbil.outputs.archive-sha256 }}-${{ hashFiles('gerbil.pkg') }}
      - name: Install pinned dependencies
        run: |
          echo "BUILD-WORKERS $GERBIL_BUILD_CORES"
          GERBIL_BUILD_VERBOSE=1 gerbil deps --install
      # Publish the exact dependency cohort after its native install succeeds.
      # A later Core failure should not require another cold dependency build.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: steps.restore-dependencies.outputs.cache-hit != 'true'
        with:
          path: |
            .gerbil/pkg
            .gerbil/lib/clan
            .gerbil/lib/static/clan__poo*.scm
            .gerbil/bin
          key: ${{ steps.restore-dependencies.outputs.cache-primary-key }}
      - name: Check Yuanxu package namespace
        run: just check-package-namespace
      - name: Build Yuanxu
        run: GERBIL_BUILD_VERBOSE=1 gerbil build
      # Profile roots, namespace windows, the downstream package and the public prelude
      # run in the required test partition, with one receipt per file.
      - name: Check complete disjoint test partition
        run: just check-test-groups
      - name: Preserve dependency and library tree
        # Test products are local to the checkout whose runtime Make timestamps
        # produced them. A shard's fresh checkout must issue its own test build;
        # do not restore either half of an earlier test product/approval pair.
        run: >-
          tar --exclude=.gerbil/test-lib
          --exclude=.gerbil/lib/.yuanxu-test-publications
          -czf "$RUNNER_TEMP/yuanxu-package.tar.gz" .gerbil
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: upload-package
        with:
          name: yuanxu-package-${{ inputs.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/yuanxu-package.tar.gz
          retention-days: 2
          if-no-files-found: error
          # The tarball is already compressed.
          compression-level: 0
      - name: Reject build input context regressions
        # The modules partition runs the publication and source-admission suites.
        run: just test-build-input-context-mutations "$RUNNER_TEMP/build-input-context"
      - name: Retain build input context mutation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: yuanxu-build-input-context-${{ inputs.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/build-input-context/**/receipt.json
            ${{ runner.temp }}/build-input-context/**/*.log
          if-no-files-found: ignore
          retention-days: 7
  tests:
    name: Test ${{ matrix.group }}
    needs: build
    # The mutation verdict still fails bootstrap. Its result is independent
    # of whether the same-head package can run the ordinary test partition.
    if: ${{ !cancelled() && needs.build.outputs.package-ready == 'success' }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        group: [modules, runtime, contracts, bootstrap, dense-declarations, dense-selection, dense-values]
    env:
      GERBIL_PATH: ${{ github.workspace }}/.gerbil
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup-gerbil
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: yuanxu-package-${{ inputs.os }}-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Restore same-head artifacts
        id: restore-package
        run: tar -xzf "$RUNNER_TEMP/yuanxu-package.tar.gz"
      - name: Run serial Gerbil tests and report each file
        env:
          # Keep the original per-worker diagnostic logs as CI artifacts even
          # when the parent reaches its unchanged execution deadline.
          TMPDIR: ${{ runner.temp }}
          YUANXU_TEST_REPORT_DIR: ${{ runner.temp }}/test-report
        run: just test-directory '${{ matrix.group }}'
      - name: Run published module TestSuites outside mechanism Cases
        if: ${{ !cancelled() && steps.restore-package.outcome == 'success' && matrix.group == 'modules' }}
        env:
          TMPDIR: ${{ runner.temp }}
          YUANXU_TEST_REPORT_DIR: ${{ runner.temp }}/published-module-suites
        run: just test-selected-modules
      - name: Retain test reports and declaration diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: yuanxu-declaration-${{ inputs.os }}-${{ matrix.group }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/test-report/
            ${{ runner.temp }}/published-module-suites/
            ${{ runner.temp }}/declaration-scale-observation-*
          if-no-files-found: ignore
