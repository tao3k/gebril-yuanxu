name: Platform
on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    name: Build and test
    runs-on: ${{ inputs.os }}
    timeout-minutes: 120
    env:
      GERBIL_PATH: ${{ github.workspace }}/.gerbil
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup-gerbil
        id: gerbil
      - name: Select runtime compiler capacity
        id: workers
        shell: bash
        run: |
          # Dependency compilation is serial; use the actual runner allocation.
          # Test heap and watchdog profiles retain their independent limits.
          if [[ "$RUNNER_OS" == macOS ]]; then
            workers=$(sysctl -n hw.logicalcpu)
          else
            workers=$(getconf _NPROCESSORS_ONLN)
          fi
          echo "count=$workers" >> "$GITHUB_OUTPUT"
          echo "BUILD-WORKERS $workers"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: restore-dependencies
        # Only the pinned POO dependency namespace crosses CI runs. Archiving
        # lib itself would recursively include test approvals; a negative
        # top-level glob does not remove descendants of an archived directory.
        with:
          path: |
            .gerbil/pkg
            .gerbil/lib/clan
            .gerbil/lib/static/clan__poo*.scm
            .gerbil/bin
          key: yuanxu-gerbil-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.gerbil.outputs.archive-sha256 }}-${{ hashFiles('gerbil.pkg') }}
      - name: Install pinned dependencies
        env:
          GERBIL_BUILD_CORES: ${{ steps.workers.outputs.count }}
        run: |
          echo "BUILD-WORKERS $GERBIL_BUILD_CORES"
          GERBIL_BUILD_VERBOSE=1 gerbil deps --install
      # Publish the exact dependency cohort after its native install succeeds.
      # A later Core failure should not require another cold dependency build.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: steps.restore-dependencies.outputs.cache-hit != 'true'
        with:
          path: |
            .gerbil/pkg
            .gerbil/lib/clan
            .gerbil/lib/static/clan__poo*.scm
            .gerbil/bin
          key: ${{ steps.restore-dependencies.outputs.cache-primary-key }}
      - name: Check Yuanxu package namespace
        run: just check-package-namespace
      - name: Build Yuanxu
        id: build-core
        env:
          GERBIL_BUILD_CORES: ${{ steps.workers.outputs.count }}
        run: GERBIL_BUILD_VERBOSE=1 just build
      - name: Reject build input context regressions
        env:
          GERBIL_BUILD_CORES: ${{ steps.workers.outputs.count }}
        run: just test-build-input-context-mutations "$RUNNER_TEMP/build-input-context"
      - name: Run serial Gerbil tests and report each file
        if: ${{ !cancelled() && steps.build-core.outcome == 'success' }}
        env:
          TMPDIR: ${{ runner.temp }}
          YUANXU_TEST_REPORT_DIR: ${{ runner.temp }}/test-report
        run: just test-platform
      - name: Run published module TestSuites outside mechanism Cases
        if: ${{ !cancelled() && steps.build-core.outcome == 'success' }}
        env:
          TMPDIR: ${{ runner.temp }}
          YUANXU_TEST_REPORT_DIR: ${{ runner.temp }}/published-module-suites
        run: just test-selected-modules
      - name: Retain test and mutation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae456e7c1c64a875d1fc6a0a
        with:
          name: yuanxu-qualification-${{ inputs.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/test-report/
            ${{ runner.temp }}/published-module-suites/
            ${{ runner.temp }}/declaration-scale-observation-*
            ${{ runner.temp }}/build-input-context/**/receipt.json
            ${{ runner.temp }}/build-input-context/**/*.log
          if-no-files-found: ignore
          retention-days: 7
